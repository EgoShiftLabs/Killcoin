name: Agency homepage asset smoke test
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/media/**'
      - 'assets/operatives/**'
      - 'tests/site-assets.test.mjs'
      - '.github/workflows/site-assets.yml'
permissions:
  contents: read
jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate asset references and inline scripts
        run: node --test tests/site-assets.test.mjs
