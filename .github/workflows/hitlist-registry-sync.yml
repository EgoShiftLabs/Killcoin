name: HITLIST Agency registry sync

on:
  push:
    branches: [main]
    paths:
      - "agency/**"
      - "data/approved-nominees.json"
      - "scripts/sync-registry.mjs"
      - "tests/registry.test.mjs"
      - ".github/workflows/hitlist-registry-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hitlist-registry-sync
  cancel-in-progress: false

jobs:
  public-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify registry parser
        run: node --test tests/registry.test.mjs
      - name: Sync only separate approved-only public sheet
        env:
          HITLIST_PUBLIC_CSV_URL: ${{ vars.HITLIST_PUBLIC_CSV_URL }}
        run: node scripts/sync-registry.mjs
      - name: Save reviewed public cases
        run: |
          if ! git diff --quiet -- data/approved-nominees.json; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add data/approved-nominees.json
            git commit -m "Update HITLIST public reviewed registry"
            git push
          else
            echo "No approved registry changes."
          fi
